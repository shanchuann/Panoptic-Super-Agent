<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Microsoft YaHei, Segoe UI, sans-serif">
<rect width="1400" height="1000" fill="#FFFFFF"/><text x="60" y="64" font-size="30" font-weight="700" fill="#1B2A41">分层记忆结构</text><text x="60" y="94" font-size="15" fill="#5B6B7C">模型读概念，证据可回溯；标签决定管理策略，权重决定保留周期</text><line x1="60" y1="118" x2="1340" y2="118" stroke="#D8DEE9"/><polygon points="360,170 760,170 820,256 300,256" fill="#EDE9FE" stroke="#7C3AED"/><text x="560" y="208" font-size="16" font-weight="600" fill="#7C3AED" text-anchor="middle">L4 项目与用户画像</text><text x="560" y="232" font-size="12" fill="#5B6B7C" text-anchor="middle">目标、约束、关键决策、偏好</text><polygon points="330,264 790,264 860,350 260,350" fill="#E0F2FE" stroke="#0369A1"/><text x="560" y="302" font-size="16" font-weight="600" fill="#0369A1" text-anchor="middle">L3 概念与图式</text><text x="560" y="326" font-size="12" fill="#5B6B7C" text-anchor="middle">偏好、经验、教训、反模式、技能资产</text><polygon points="298,358 822,358 900,444 220,444" fill="#DCFCE7" stroke="#15803D"/><text x="560" y="396" font-size="16" font-weight="600" fill="#15803D" text-anchor="middle">L2 原子事实</text><text x="560" y="420" font-size="12" fill="#5B6B7C" text-anchor="middle">主谓宾、条件、时间、置信度、证据标识</text><polygon points="266,452 854,452 940,538 180,538" fill="#FEF3C7" stroke="#B45309"/><text x="560" y="490" font-size="16" font-weight="600" fill="#B45309" text-anchor="middle">L1 情节</text><text x="560" y="514" font-size="12" fill="#5B6B7C" text-anchor="middle">会话片段、步骤摘要、任务过程</text><polygon points="234,546 886,546 980,632 140,632" fill="#FEE2E2" stroke="#B91C1C"/><text x="560" y="584" font-size="16" font-weight="600" fill="#B91C1C" text-anchor="middle">L0 证据</text><text x="560" y="608" font-size="12" fill="#5B6B7C" text-anchor="middle">原始消息、工具输出、文件、差异、网页快照</text><rect x="900" y="170" width="440" height="150" rx="8" fill="#FBFBFC" stroke="undefined"/><text x="920" y="196" font-size="14" font-weight="600" fill="#1B2A41">读取规则</text><text x="920" y="222" font-size="12" fill="#5B6B7C">L4 与 L3 默认注入</text><text x="920" y="246" font-size="12" fill="#5B6B7C">L2 命中后注入，带证据标识</text><text x="920" y="270" font-size="12" fill="#5B6B7C">L0 与 L1 只通过句柄下钻</text><text x="920" y="294" font-size="12" fill="#5B6B7C">每次注入不超过上下文配额的一成半</text><rect x="900" y="336" width="440" height="150" rx="8" fill="#FBFBFC" stroke="undefined"/><text x="920" y="362" font-size="14" font-weight="600" fill="#1B2A41">写入与更新</text><text x="920" y="388" font-size="12" fill="#5B6B7C">任务结束或每五轮异步抽取</text><text x="920" y="412" font-size="12" fill="#5B6B7C">冲突时生成新版本，旧版标记替代</text><text x="920" y="436" font-size="12" fill="#5B6B7C">用户明确要求时权重恒为一</text><text x="920" y="460" font-size="12" fill="#5B6B7C">敏感信息默认不写入</text><rect x="900" y="502" width="440" height="150" rx="8" fill="#FBFBFC" stroke="undefined"/><text x="920" y="528" font-size="14" font-weight="600" fill="#1B2A41">遗忘与删除</text><text x="920" y="554" font-size="12" fill="#5B6B7C">权重低于阈值先归档</text><text x="920" y="578" font-size="12" fill="#5B6B7C">睡眠整合负责合并与去重</text><text x="920" y="602" font-size="12" fill="#5B6B7C">硬删除级联索引与缓存</text><text x="920" y="626" font-size="12" fill="#5B6B7C">删除后六十秒内检索不可见</text><rect x="60" y="800" width="1280" height="110" rx="8" fill="#F1F3F5" stroke="#8A97A6"/><text x="80" y="828" font-size="14" font-weight="600" fill="#1B2A41">标签策略与权重</text><text x="80" y="852" font-size="12.5" fill="#5B6B7C">类型、来源、作用域、稳定性、敏感级共同决定初始权重、半衰期、注入优先级与删除要求。</text><text x="80" y="874" font-size="12.5" fill="#5B6B7C">作用域：全局，项目，任务，执行体。有效性：活动，被替代，无效，归档。权重只负责排序与注入，删除由有效性、保留策略与隐私要求决定。</text><text x="60" y="946" font-size="12" fill="#8A97A6">图 3　五层记忆：下层保留证据，上层保留结构；模型默认读取 L3 与 L4，需要细节时沿证据标识下钻。</text>
</svg>