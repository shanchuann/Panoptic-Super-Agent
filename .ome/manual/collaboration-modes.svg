<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Microsoft YaHei, Segoe UI, sans-serif">
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="60" y="64" font-size="30" font-weight="700" fill="#1B2A41">协作模式与选择</text>
<text x="60" y="94" font-size="15" fill="#5B6B7C">默认最小充分范式，出现证据再升级；用户始终只面对一个入口</text>
<line x1="60" y1="118" x2="1340" y2="118" stroke="#D8DEE9"/>

<rect x="60" y="160" width="190" height="120" rx="8" fill="#F1F3F5" stroke="#8A97A6"/>
<circle cx="96" cy="196" r="12" fill="none" stroke="#4B5C70" stroke-width="1.6"/>
<path d="M84 208 q12 -16 24 0" fill="none" stroke="#4B5C70" stroke-width="1.6"/>
<text x="120" y="196" font-size="15" font-weight="600" fill="#1B2A41">用户</text>
<text x="80" y="232" font-size="12" fill="#5B6B7C">目标 · 问询 · 验收</text>
<text x="80" y="252" font-size="12" fill="#5B6B7C">只看结果与待办</text>

<rect x="300" y="160" width="230" height="120" rx="8" fill="#1E3A5F"/>
<text x="320" y="192" font-size="15" font-weight="600" fill="#FFFFFF">协调入口</text>
<text x="320" y="216" font-size="12.5" fill="#D7E1EC">规则分诊 · 轻模型判断</text>
<text x="320" y="238" font-size="12.5" fill="#D7E1EC">派发 · 仲裁 · 汇报</text>

<g>
<rect x="580" y="150" width="230" height="100" rx="6" fill="#FFFFFF" stroke="#5B8DB8"/>
<circle cx="610" cy="180" r="10" fill="none" stroke="#5B8DB8"/><text x="640" y="184" font-size="14" font-weight="600" fill="#1B2A41">M0 单执行</text>
<text x="600" y="210" font-size="11.5" fill="#5B6B7C">单产物、少步骤</text><text x="600" y="230" font-size="11.5" fill="#8A97A6">默认起点</text></g>
<g>
<rect x="840" y="150" width="230" height="100" rx="6" fill="#FFFFFF" stroke="#5B8DB8"/>
<circle cx="870" cy="180" r="10" fill="none" stroke="#5B8DB8"/><text x="900" y="184" font-size="14" font-weight="600" fill="#1B2A41">M1 协调者</text>
<text x="860" y="210" font-size="11.5" fill="#5B6B7C">派活与单次交接</text><text x="860" y="230" font-size="11.5" fill="#8A97A6">中等任务默认</text></g>
<g>
<rect x="1100" y="150" width="230" height="100" rx="6" fill="#FFFFFF" stroke="#5B8DB8"/>
<circle cx="1130" cy="180" r="10" fill="none" stroke="#5B8DB8"/><text x="1160" y="184" font-size="14" font-weight="600" fill="#1B2A41">M2 黑板并行</text>
<text x="1120" y="210" font-size="11.5" fill="#5B6B7C">状态模型与均匀扇出</text><text x="1120" y="230" font-size="11.5" fill="#8A97A6">多独立子任务</text></g>
<g>
<rect x="580" y="270" width="230" height="100" rx="6" fill="#FFFFFF" stroke="#5F9E62"/>
<circle cx="610" cy="300" r="10" fill="none" stroke="#5F9E62"/><text x="640" y="304" font-size="14" font-weight="600" fill="#1B2A41">M3 流水线</text>
<text x="600" y="330" font-size="11.5" fill="#5B6B7C">固定阶段链</text><text x="600" y="350" font-size="11.5" fill="#8A97A6">流程稳定时</text></g>
<g>
<rect x="840" y="270" width="230" height="100" rx="6" fill="#FFFFFF" stroke="#5F9E62"/>
<circle cx="870" cy="300" r="10" fill="none" stroke="#5F9E62"/><text x="900" y="304" font-size="14" font-weight="600" fill="#1B2A41">M4 两级扇出</text>
<text x="860" y="330" font-size="11.5" fill="#5B6B7C">最多两级，无子主管</text><text x="860" y="350" font-size="11.5" fill="#8A97A6">超大项目</text></g>
<g>
<rect x="1100" y="270" width="230" height="100" rx="6" fill="#FFFFFF" stroke="#7B61B5"/>
<circle cx="1130" cy="300" r="10" fill="none" stroke="#7B61B5"/><text x="1160" y="304" font-size="14" font-weight="600" fill="#1B2A41">M5 辩论</text>
<text x="1120" y="330" font-size="11.5" fill="#5B6B7C">仅离线复核</text><text x="1120" y="350" font-size="11.5" fill="#8A97A6">不进运行时</text></g>
<g>
<rect x="580" y="390" width="230" height="100" rx="6" fill="#FFFFFF" stroke="#8A97A6"/>
<circle cx="610" cy="420" r="10" fill="none" stroke="#8A97A6"/><text x="640" y="424" font-size="14" font-weight="600" fill="#1B2A41">M6 人工</text>
<text x="600" y="450" font-size="11.5" fill="#5B6B7C">不可逆或合规判断</text><text x="600" y="470" font-size="11.5" fill="#8A97A6">强制升级</text></g>
<g>
<rect x="840" y="390" width="230" height="100" rx="6" fill="#FFFFFF" stroke="#C98A4B"/>
<circle cx="870" cy="420" r="10" fill="none" stroke="#C98A4B"/><text x="900" y="424" font-size="14" font-weight="600" fill="#1B2A41">外部执行体</text>
<text x="860" y="450" font-size="11.5" fill="#5B6B7C">代码代理或外部运行时</text><text x="860" y="470" font-size="11.5" fill="#8A97A6">作为工具或子执行器</text></g>

<line x1="250" y1="220" x2="300" y2="220" stroke="#8A97A6" stroke-width="1.3"/>
<line x1="415" y1="280" x2="415" y2="600" stroke="#8A97A6" stroke-width="1.3"/>
<line x1="415" y1="500" x2="580" y2="500" stroke="#8A97A6" stroke-width="1.3"/>
<line x1="580" y1="200" x2="580" y2="440" stroke="#8A97A6" stroke-width="1.3"/>
<line x1="810" y1="200" x2="840" y2="200" stroke="#8A97A6" stroke-width="1.3"/>
<line x1="810" y1="320" x2="840" y2="320" stroke="#8A97A6" stroke-width="1.3"/>
<line x1="810" y1="440" x2="840" y2="440" stroke="#8A97A6" stroke-width="1.3"/>
<line x1="1070" y1="200" x2="1100" y2="200" stroke="#8A97A6" stroke-width="1.3"/>
<line x1="1070" y1="320" x2="1100" y2="320" stroke="#8A97A6" stroke-width="1.3"/>

<rect x="300" y="600" width="1030" height="170" rx="8" fill="#F1F3F5" stroke="#8A97A6"/>
<text x="320" y="630" font-size="15" font-weight="600" fill="#1B2A41">协调策略层</text>
<text x="320" y="658" font-size="12.5" fill="#5B6B7C">输入：产物数量、可分解性、预估步数、领域广度、判据清晰度、风险、写域冲突、资源余量</text>
<text x="320" y="684" font-size="12.5" fill="#5B6B7C">输出：并行度、隔离级别、人工闸门与模式标签；决策写入审计，可由用户覆盖</text>
<text x="320" y="710" font-size="12.5" fill="#5B6B7C">门槛：任何多执行单元模式进入默认路径前，必须有同任务集的重复实验证据</text>
<text x="320" y="742" font-size="12" fill="#8A97A6">模式切换前保留检查点与上下文包；用户始终使用同一个项目图与收件箱。</text>

<rect x="60" y="820" width="1280" height="90" rx="8" fill="#FBFBFC" stroke="undefined"/>
<text x="80" y="848" font-size="13" font-weight="600" fill="#1B2A41">选择原则</text>
<text x="80" y="872" font-size="12" fill="#5B6B7C">先规则，后模型；先单执行，后并行；先证据，后升级。模式是调度参数，不是产品形态。</text>
<text x="80" y="894" font-size="12" fill="#5B6B7C">所有模式都经过能力网关与执行账本；多执行单元模式共享决策，不共享轨迹，避免隐式假设冲突。</text>
<text x="60" y="956" font-size="11.5" fill="#8A97A6">图 4　协作模式：M0 与 M1 是默认路径，M2 与 M4 需要实验证据，M5 只用于离线复核，M6 处理不可逆判断。</text>
</svg>