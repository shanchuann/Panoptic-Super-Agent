<text x="646" y="816" font-size="11" fill="#5B6B7C">统一执行入口，沙箱</text>
<rect x="850" y="768" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#7B61B5" stroke-dasharray="5 4"/>
<text x="866" y="796" font-size="13" font-weight="600" fill="#4B3A78">能力网关</text>
<text x="866" y="816" font-size="11" fill="#5B6B7C">授权，风险，审批</text>
<rect x="1070" y="768" width="250" height="80" rx="6" fill="#FFFFFF" stroke="#B7A6DD"/>
<text x="1086" y="796" font-size="13" font-weight="600" fill="#1B2A41">模型网关</text>
<text x="1086" y="816" font-size="11" fill="#5B6B7C">自带密钥，分层路由</text>
</g>

<g>
<rect x="60" y="876" width="1280" height="62" rx="8" fill="#F1F3F5" stroke="#8A97A6"/>
<text x="80" y="900" font-size="13" font-weight="600" fill="#3A4757">保障层</text>
<text x="180" y="900" font-size="11.5" fill="#3A4757">治理：默认只读，三类审批，资源上限</text>
<text x="520" y="900" font-size="11.5" fill="#3A4757">可演进契约：内核冻结，四层分级</text>
<text x="830" y="900" font-size="11.5" fill="#3A4757">数据生命周期：导出，导入，迁移，删除</text>
<text x="180" y="922" font-size="11.5" fill="#3A4757">可观测性：OpenTelemetry 追踪项目，任务，上下文，模型，工具与验证</text>
</g>

<text x="60" y="972" font-size="11.5" fill="#8A97A6">图 1　总体架构 v1.2：三个循环共享项目状态，执行账本保证恢复，能力网关统一授权，可观测性覆盖全链路。</text>
</svg>