<text x="80" y="184" font-size="11.5" fill="#5B6B7C">理解意图，直接回答或创建任务</text>
<rect x="500" y="140" width="400" height="56" rx="8" fill="#E9F5E9" stroke="#5F9E62"/>
<text x="520" y="164" font-size="13.5" font-weight="600" fill="#2F5B32">执行循环</text>
<text x="520" y="184" font-size="11.5" fill="#5B6B7C">规划、工具、检查点、验证</text>
<rect x="940" y="140" width="400" height="56" rx="8" fill="#EFE9FB" stroke="#7B61B5"/>
<text x="960" y="164" font-size="13.5" font-weight="600" fill="#4B3A78">学习循环</text>
<text x="960" y="184" font-size="11.5" fill="#5B6B7C">抽取、合并、失效、遗忘</text>
</g>

<g>
<rect x="60" y="224" width="380" height="72" rx="8" fill="#F4F6F9" stroke="#8A97A6"/>
<text x="80" y="250" font-size="13.5" font-weight="600" fill="#1B2A41">用户入口</text>
<text x="80" y="272" font-size="11.5" fill="#5B6B7C">自然语言，验收，迭代</text>
<rect x="470" y="224" width="460" height="72" rx="8" fill="#F4F6F9" stroke="#8A97A6"/>
<text x="490" y="250" font-size="13.5" font-weight="600" fill="#1B2A41">项目容器</text>
<text x="490" y="272" font-size="11.5" fill="#5B6B7C">Project，Brief，Goal，Task，Run，Artifact</text>
<rect x="960" y="224" width="380" height="72" rx="8" fill="#F4F6F9" stroke="#8A97A6"/>
<text x="980" y="250" font-size="13.5" font-weight="600" fill="#1B2A41">外部事件</text>
<text x="980" y="272" font-size="11.5" fill="#5B6B7C">后续阶段触发器，默认不可信</text>
</g>

<line x1="60" y1="318" x2="1340" y2="318" stroke="#9AA7B6" stroke-dasharray="6 5"/>
