<rect x="1050" y="488" width="270" height="80" rx="6" fill="#FFFFFF" stroke="#C98A4B" stroke-dasharray="5 4"/>
<text x="1068" y="516" font-size="13.5" font-weight="600" fill="#7A4A18">执行账本</text>
<text x="1068" y="536" font-size="11.5" fill="#5B6B7C">幂等键，提交状态，检查点</text>
<text x="1068" y="554" font-size="11.5" fill="#5B6B7C">恢复时先查账本</text>
</g>

<line x1="60" y1="598" x2="1340" y2="598" stroke="#9AA7B6" stroke-dasharray="6 5"/>
<text x="60" y="590" font-size="11.5" fill="#8A97A6">决策与验证契约</text>

<g>
<rect x="60" y="616" width="1280" height="104" rx="10" fill="#E9F5E9" stroke="#5F9E62"/>
<text x="80" y="642" font-size="14" font-weight="700" fill="#2F5B32">决策与执行层</text>
<rect x="190" y="628" width="340" height="80" rx="6" fill="#FFFFFF" stroke="#A9CCAA"/>
<text x="208" y="656" font-size="13.5" font-weight="600" fill="#1B2A41">协调策略层</text>
<text x="208" y="676" font-size="11.5" fill="#5B6B7C">模式，并行度，人工闸门</text>
<text x="208" y="694" font-size="11.5" fill="#5B6B7C">规则优先，证据升级</text>
<rect x="550" y="628" width="340" height="80" rx="6" fill="#FFFFFF" stroke="#A9CCAA"/>
<text x="568" y="656" font-size="13.5" font-weight="600" fill="#1B2A41">编排循环</text>
<text x="568" y="676" font-size="11.5" fill="#5B6B7C">规划，执行，停止条件</text>
<text x="568" y="694" font-size="11.5" fill="#5B6B7C">检查点可恢复</text>
<rect x="910" y="628" width="410" height="80" rx="6" fill="#FFFFFF" stroke="#A9CCAA"/>
<text x="928" y="656" font-size="13.5" font-weight="600" fill="#1B2A41">验证网络</text>
<text x="928" y="676" font-size="11.5" fill="#5B6B7C">脚本，独立评审，人工</text>
<text x="928" y="694" font-size="11.5" fill="#5B6B7C">执行者与验证者分离</text>
</g>

<line x1="60" y1="738" x2="1340" y2="738" stroke="#9AA7B6" stroke-dasharray="6 5"/>
