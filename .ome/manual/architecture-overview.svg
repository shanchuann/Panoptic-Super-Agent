<g>
<rect x="60" y="336" width="1280" height="104" rx="10" fill="#E8F1FB" stroke="#5B8DB8"/>
<text x="80" y="362" font-size="14" font-weight="700" fill="#1B4B72">交互层</text>
<rect x="190" y="348" width="340" height="80" rx="6" fill="#FFFFFF" stroke="#9DBAD3"/>
<text x="208" y="376" font-size="13.5" font-weight="600" fill="#1B2A41">图谱与看板</text>
<text x="208" y="396" font-size="11.5" fill="#5B6B7C">依赖，进度，产物，阻塞</text>
