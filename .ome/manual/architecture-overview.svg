<text x="508" y="536" font-size="11.5" fill="#5B6B7C">只追加，可回放</text>
<text x="508" y="554" font-size="11.5" fill="#5B6B7C">V4 格式</text>
<rect x="770" y="488" width="260" height="80" rx="6" fill="#FFFFFF" stroke="#D8B48C"/>
<text x="788" y="516" font-size="13.5" font-weight="600" fill="#1B2A41">证据索引</text>
<text x="788" y="536" font-size="11.5" fill="#5B6B7C">句柄，哈希，溯源</text>
