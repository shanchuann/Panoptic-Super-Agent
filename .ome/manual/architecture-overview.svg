<rect x="190" y="488" width="280" height="80" rx="6" fill="#FFFFFF" stroke="#D8B48C"/>
<text x="208" y="516" font-size="13.5" font-weight="600" fill="#1B2A41">项目域（黑板）</text>
<text x="208" y="536" font-size="11.5" fill="#5B6B7C">任务，产物，审批，审计</text>
