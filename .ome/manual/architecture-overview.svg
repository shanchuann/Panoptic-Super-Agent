<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Microsoft YaHei, Segoe UI, sans-serif">
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="60" y="64" font-size="30" font-weight="700" fill="#1B2A41">万象超级智能体架构图 v1.2</text>
<text x="60" y="94" font-size="15" fill="#5B6B7C">三个运行循环共享项目状态；执行账本负责恢复，能力网关负责授权，可观测性贯穿全链路。</text>
<line x1="60" y1="118" x2="1340" y2="118" stroke="#C9D2DE"/>

<g>
<rect x="60" y="140" width="400" height="56" rx="8" fill="#E8F1FB" stroke="#5B8DB8"/>
